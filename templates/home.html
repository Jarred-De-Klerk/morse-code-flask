{% extends "base.html" %}
<title>Home</title>
{%block content%}
    <h1>Welcome to The Morse Code Converter!</h1>
    <p>Type in the text you would like to convert into morse code here:</p>
    <form method="post" action="" novalidate>
        {{form.hidden_tag()}}
        {{form.text_to_convert.label}}
        {{form.text_to_convert}}
        {{form.submit(class="btn btn-danger")}}
    </form>
{% endblock %}
